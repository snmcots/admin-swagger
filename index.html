<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cots Admin API</title>
    <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
    <link rel="stylesheet" href="swagger-ui.css" />
    <style>
      body { margin: 0; background: #fafafa; }
      .cots-bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 10px 20px;
        background: #1f2937; color: #e5e7eb; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
      .cots-bar strong { color: #fff; font-size: 15px; }
      .cots-bar a { color: #93c5fd; text-decoration: none; }
      .cots-bar a:hover { text-decoration: underline; }
      .cots-bar .sep { opacity: .4; }
      .swagger-ui .topbar { display: none; }
    </style>
  </head>
  <body>
    <div class="cots-bar">
      <strong>Cots Admin API</strong>
      <span class="sep">|</span>
      <span>Spec: <a href="openapi.json">openapi.json</a> · <a href="openapi.yaml">openapi.yaml</a></span>
      <span class="sep">|</span>
      <span id="postman">Postman: loading…</span>
    </div>
    <div id="swagger-ui"></div>
    <script src="swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        docExpansion: "none",
        filter: true,
        tryItOutEnabled: false,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
      });
      fetch("postman/index.json")
        .then((r) => r.json())
        .then(({ collections }) => {
          const el = document.getElementById("postman");
          el.textContent = "Postman: ";
          collections.forEach((c, i) => {
            if (i) el.append(" · ");
            const a = document.createElement("a");
            a.href = c.url;
            a.download = "";
            a.textContent = `${c.name} collection`;
            a.title = `baseUrl ${c.baseUrl}`;
            el.append(a);
          });
        })
        .catch(() => { document.getElementById("postman").textContent = "Postman: postman/index.json not found"; });
    </script>
  </body>
</html>
